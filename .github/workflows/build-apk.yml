name: coli enak
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP file'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          
      - name: Download ZIP
        run: |
          wget -O project.zip "${{ github.event.inputs.zip_url }}"
          
      - name: Extract ZIP
        run: |
          unzip -o project.zip
          EXTRACT_DIR=$(find . -maxdepth 1 -type d -name "*-*" | head -n 1)
          echo "EXTRACT_DIR=$EXTRACT_DIR" >> $GITHUB_ENV
          
      - name: Get Dependencies
        run: |
          cd ${{ env.EXTRACT_DIR }}
          flutter pub get
          
      - name: Build APK Release
        run: |
          cd ${{ env.EXTRACT_DIR }}
          flutter build apk --release --split-per-abi
          
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Build #${{ github.run_number }}
          draft: false
          prerelease: false
          
      - name: Upload APK arm64-v8a
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.EXTRACT_DIR }}/build/app/outputs/apk/release/app-arm64-v8a-release.apk
          asset_name: app-arm64-v8a-release.apk
          asset_content_type: application/vnd.android.package-archive
          
      - name: Upload APK armeabi-v7a
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.EXTRACT_DIR }}/build/app/outputs/apk/release/app-armeabi-v7a-release.apk
          asset_name: app-armeabi-v7a-release.apk
          asset_content_type: application/vnd.android.package-archive
          
      - name: Upload APK x86_64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.EXTRACT_DIR }}/build/app/outputs/apk/release/app-x86_64-release.apk
          asset_name: app-x86_64-release.apk
          asset_content_type: application/vnd.android.package-archive
