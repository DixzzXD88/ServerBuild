name: dart to html

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (GitHub Release asset)"
        required: true
        type: string
      tag:
        description: "Tag unik build (dipakai untuk nama artifact)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validasi input wajib
        run: |
          if [ -z "${{ inputs.zip_url }}" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::Input tag kosong."
            exit 1
          fi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: "stable"
          cache: true

      - name: Download ZIP project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: curl -L --fail -o project.zip "$ZIP_URL"

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project

          shopt -s nullglob dotglob
          entries=(project/*/)
          if [ "${#entries[@]}" -eq 1 ] && [ -f "${entries[0]}pubspec.yaml" ]; then
            tmp=$(mktemp -d)
            mv "${entries[0]}"* "$tmp"/
            rm -rf project
            mv "$tmp" project
          fi

      - name: Validasi pubspec.yaml
        run: |
          if [ ! -f project/pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP."
            exit 1
          fi

      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Build Web
        working-directory: project
        run: flutter build web --release

      - name: Upload Web sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.tag }}
          path: project/build/web/
          if-no-files-found: warn
          retention-days: 1
