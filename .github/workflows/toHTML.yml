name: dart to html

on:
  workflow_dispatch:
    inputs:
      dart_code:
        description: "Tempelkan kode Dart kamu (1 file aja)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          flutter create --platforms=web temp_project
          cd temp_project
          rm -rf lib/
          mkdir -p lib
          mkdir -p assets/images

      - name: Generate pubspec.yaml
        run: |
          cd temp_project
          cat > pubspec.yaml << 'EOF'
          name: temp_project
          description: A Flutter web project.
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.1.0
            url_launcher: ^6.2.0
            shared_preferences: ^2.2.0
            device_info_plus: ^9.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

      - name: Write main.dart
        run: |
          cd temp_project/lib
          echo "${{ inputs.dart_code }}" > main.dart

      - name: Generate dummy splash.dart (biar gak error)
        run: |
          cd temp_project/lib
          cat > splash.dart << 'EOF'
          import 'package:flutter/material.dart';

          class SplashScreen extends StatelessWidget {
            final String username;
            final String password;
            final String role;
            final String sessionKey;
            final String expiredDate;
            final List<Map<String, dynamic>> listBug;
            final List<Map<String, dynamic>> listDoos;
            final List<Map<String, dynamic>> news;

            const SplashScreen({
              super.key,
              required this.username,
              required this.password,
              required this.role,
              required this.sessionKey,
              required this.expiredDate,
              required this.listBug,
              required this.listDoos,
              required this.news,
            });

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: Text('Splash Screen (Dummy)'),
                ),
              );
            }
          }
          EOF

      - name: Create dummy logo
        run: |
          cd temp_project/assets/images
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > logo.jpg

      - name: Build Web
        run: |
          cd temp_project
          flutter pub get
          flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: temp_project/build/web
